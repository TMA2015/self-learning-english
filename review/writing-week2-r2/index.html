/* Isolated Grammar design pilot: four core sections plus authored adaptive detail. */
.gdp-shell{max-width:1100px;margin:0 auto;padding:28px 28px 56px;color:#20334d;font-size:16px;line-height:1.7}
.gdp-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.gdp-brand{font-size:21px;font-weight:800;color:#245aa8}.gdp-language{display:flex;align-items:center;gap:9px;font-size:14px}.gdp-language input{width:18px;height:18px}
.gdp-preview-note{background:#eef4fc;border-left:4px solid #4779b9;padding:14px 18px;border-radius:8px;margin-bottom:22px}.gdp-preview-note p{margin:4px 0 0;font-size:14px}
.gdp-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:32px}.gdp-picker button{text-align:left;min-width:0;white-space:normal;padding:14px 16px;background:white;border:1px solid #ccd9e9;border-radius:12px;color:inherit;cursor:pointer}.gdp-picker span{display:block;font-size:12px;margin-bottom:5px}.gdp-picker strong{display:block}.gdp-picker [aria-pressed=true]{background:#214e89;color:white;border-color:#214e89}
.gdp-lesson header{margin:28px 0}.gdp-eyebrow,.gdp-number{font-size:12px;font-weight:750;letter-spacing:.06em;color:#436994}.gdp-lesson h1{font-size:clamp(26px,4vw,38px);line-height:1.2;margin:10px 0}.gdp-subtitle{color:#586b80}.gdp-card{min-width:0;border:1px solid #dce5ef;border-radius:14px;background:white;padding:24px;margin:0 0 20px}.gdp-card h2{font-size:23px;line-height:1.3;margin:5px 0 16px}.gdp-card h3{font-size:19px;line-height:1.4;margin:0 0 14px}.gdp-card p{white-space:pre-line;margin:0 0 14px}.gdp-card p:last-child{margin-bottom:0}.gdp-card ul{padding-left:23px;margin:0}.gdp-card li{margin:0 0 10px}.gdp-card li:last-child{margin-bottom:0}.gdp-goals{background:#f5f9ff}.gdp-examples .gdp-items{list-style:none;padding:0;display:grid;gap:12px}.gdp-examples li{background:#f4f8fc;border-radius:9px;padding:14px 16px;margin:0}.gdp-adaptive{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.gdp-adaptive .gdp-card{margin:0}.gdp-adaptive-heading{margin:30px 0 18px}.gdp-adaptive-heading h2{margin-bottom:4px}.gdp-adaptive-heading p{margin:0;color:#586b80}/* Highlight accents belong on the left edge, not the top, in every lesson. */
.gdp-mistakes{border-top:1px solid #dce5ef;border-left:4px solid #c88b49}.gdp-vi{margin-top:24px;background:#f6f9f4}.gdp-footer{margin-top:28px;color:#586b80;font-size:14px}.gdp-table-scroll{overflow-x:auto;max-width:100%;border:1px solid #dce5ef;border-radius:9px}.gdp-table-scroll table{width:100%;border-collapse:collapse;font-size:15px}.gdp-table-scroll th,.gdp-table-scroll td{text-align:left;vertical-align:top;padding:13px;border-bottom:1px solid #dce5ef;min-width:130px}.gdp-table-scroll th{background:#eef4fc;color:#254c7a}.gdp-shell :focus-visible{outline:3px solid #b06d22;outline-offset:3px}.gdp-shell p,.gdp-shell li,.gdp-shell td,.gdp-picker strong{overflow-wrap:anywhere}
@media(max-width:700px){.gdp-shell{padding:18px 16px 36px}.gdp-top{align-items:flex-start;flex-direction:column;gap:12px}.gdp-picker,.gdp-adaptive{grid-template-columns:minmax(0,1fr)}.gdp-picker{gap:8px;margin-bottom:24px}.gdp-picker button{min-height:64px}.gdp-card{padding:18px 16px}.gdp-card h2{font-size:21px}.gdp-table-scroll table{font-size:14px}.gdp-table-scroll th,.gdp-table-scroll td{padding:10px}}

/* Integrated notes use the existing lesson title once; no repeated preview chrome. */
.gdp-integrated{max-width:960px;margin:24px 0;line-height:1.75;font-size:16px}
.gdp-integrated .gdp-card{margin-bottom:14px;padding:20px 22px}
.gdp-integrated h3{font-size:20px;margin:0 0 12px;line-height:1.35}
.gdp-integrated p,.gdp-integrated li,.gdp-integrated td{overflow-wrap:anywhere}
.gdp-integrated .gdp-card:not(.gdp-goals):not(.gdp-mistakes):not(.gdp-vi){border-left:0;border-right:0;border-radius:0}
@media(max-width:700px){.gdp-integrated .gdp-card{padding:16px 12px}.gdp-integrated h3{font-size:18px}}

/* Distinguish verified AI output from deterministic Guided Check, without claiming AI is online. */
.writing-ai-review{margin:18px 0;padding:17px 20px;border:1px solid #bfd3ea;border-radius:12px;background:#f6f9ff;color:#172f4e;max-width:100%;overflow-wrap:anywhere}
.writing-ai-review-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.writing-ai-review-heading strong{color:#214c88}
.writing-ai-review-heading span{color:#496683;font-size:13px}
.writing-ai-review li{margin:7px 0}
.writing-ai-review button{margin-top:10px}
.writing-ai-review p{line-height:1.6}

/* Knowledge-only floating English Tutor, visually consistent with the Math app. */
.english-lesson-ai{position:fixed;right:20px;bottom:20px;z-index:70;font-size:14px}
.english-lesson-ai-launch{display:flex;align-items:center;gap:8px;border:1px solid #a3c5fa;background:#2456ae;color:white;border-radius:999px;padding:12px 17px;box-shadow:0 6px 18px #102f6440;cursor:pointer}
.english-lesson-ai-panel{position:absolute;right:0;bottom:58px;width:min(420px,calc(100vw - 25px));max-height:min(74vh,600px);overflow:auto;box-sizing:border-box;background:#fff;border:1px solid #bed0e9;box-shadow:0 10px 35px #0a32653b;border-radius:15px;padding:17px}
.english-lesson-ai-panel header{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:12px}
.english-lesson-ai-panel header small{display:block;margin-top:3px;color:#5e7189}
.english-lesson-ai-panel header button{border:none;background:transparent;cursor:pointer;padding:5px}
.english-lesson-ai-quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 14px}
.english-lesson-ai-quick button{background:#f4f7fc;border:1px solid #d6e2f2;border-radius:7px;padding:9px;cursor:pointer}
.english-lesson-ai-panel textarea{display:block;width:100%;box-sizing:border-box;min-height:75px;margin:8px 0;resize:vertical;border:1px solid #aac0de;border-radius:8px;padding:10px;font:inherit}
.english-lesson-ai-panel article{background:#f5f8fc;border-radius:9px;padding:12px;margin-top:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.english-lesson-ai-panel small{display:block;margin-top:10px;line-height:1.5;color:#596983}
.english-lesson-ai-panel .primary-button{margin-top:4px}
@media(max-width:500px){.english-lesson-ai{right:10px;bottom:10px}.english-lesson-ai-panel{right:-1px;bottom:55px}}

/* Optional learning hints — closed by default, accessible by keyboard. */
.wcv2-optional-helper{margin:16px 0;border:1px solid #d0ddef;border-radius:12px;background:#f8faff;padding:0;overflow:hidden}
.wcv2-optional-helper>summary{display:flex;align-items:center;justify-content:space-between;gap:15px;cursor:pointer;padding:14px 17px;color:#21436e;list-style:none}
.wcv2-optional-helper>summary::-webkit-details-marker{display:none}
.wcv2-optional-helper>summary:focus-visible{outline:3px solid #528fe3;outline-offset:-3px;border-radius:9px}
.wcv2-helper-label{font-weight:700;display:flex;flex-direction:column;gap:4px}
.wcv2-helper-label small{font-size:12px;font-weight:400;color:#536f92}
.wcv2-helper-toggle{white-space:nowrap;font-size:13px;font-weight:650;border:1px solid #b8cee9;border-radius:8px;padding:7px 11px;background:#fff}
.wcv2-optional-helper[open] .wcv2-helper-toggle{font-size:0}
.wcv2-optional-helper[open] .wcv2-helper-toggle::after{content:"Hide hints";font-size:13px}
.wcv2-optional-helper-body{padding:0 17px 17px}
.wcv2-optional-helper-body>.wcv2-grid{margin-top:12px}

/* Learning Path pilot: these are guidance cards, never proficiency or Unit completion badges. */
/* Optional Unit study guide: preserves the free seven-skill library and the original lesson player. */
.foundation-a2-unit-guide{margin:1rem 0}
.foundation-a2-unit-guide>summary{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;align-items:center;cursor:pointer;font-size:1rem}
.foundation-a2-unit-guide>summary span{font-size:.82rem;color:var(--muted-foreground)}
.foundation-a2-unit-guide>p{margin:.75rem 0;font-size:.88rem}
.foundation-a2-unit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:.7rem;margin:1rem 0}
.foundation-a2-unit-card{border:1px solid var(--border);border-radius:.75rem;background:var(--card);padding:.75rem;min-width:0}
.foundation-a2-unit-card>summary{display:flex;flex-direction:column;gap:.15rem;cursor:pointer}
.foundation-a2-unit-card>summary strong{overflow-wrap:anywhere}
.foundation-a2-unit-id{font-weight:750;font-size:.75rem;letter-spacing:.05em;color:var(--primary)}
.foundation-a2-unit-card>summary small{color:var(--muted-foreground);line-height:1.5}
.foundation-a2-unit-card p{margin:.6rem 0 0;font-size:.85rem}
.foundation-a2-unit-lessons{display:flex;flex-direction:column;gap:.45rem;margin-top:.7rem}
.foundation-a2-unit-lesson{width:100%;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:.2rem;white-space:normal;overflow-wrap:anywhere}
.foundation-a2-unit-lesson small{color:var(--muted-foreground)}
@media(max-width:550px){.foundation-a2-unit-grid{grid-template-columns:1fr}.foundation-a2-unit-guide>summary{display:block}.foundation-a2-unit-guide>summary span{display:block;margin-top:.25rem}}
.foundation-today{margin:1rem 0}
.foundation-today .foundation-catalog-heading{gap:1rem;align-items:start;flex-wrap:wrap}
.foundation-today .foundation-catalog-heading label{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.foundation-today .foundation-catalog-heading select{max-width:100%;min-width:11rem}
.foundation-today-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:.75rem;margin:1rem 0}
.foundation-today-card{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;text-align:left;min-width:0;white-space:normal}
.foundation-today-card strong,.foundation-today-card span,.foundation-today-card small{overflow-wrap:anywhere}
.foundation-today-card small{font-weight:400;opacity:.85;line-height:1.5}
@media(max-width:380px){.foundation-today-actions{grid-template-columns:1fr}.foundation-today .foundation-catalog-heading select{min-width:0;width:100%}}

/* Lesson progress marks: submission does not imply mastery. */
.foundation-lesson-topline{display:flex;align-items:flex-start;justify-content:space-between;gap:.45rem;width:100%;min-width:0}
.foundation-lesson-topline .foundation-lesson-id{min-width:0;overflow-wrap:anywhere}
.foundation-progress-mark{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:999px;min-width:1.55rem;min-height:1.55rem;font-size:1rem;font-weight:800;line-height:1}
.foundation-progress-mark.is-submitted{background:#dcfce7;color:#136636;border:1px solid #77c79a}
.foundation-progress-mark.is-draft{background:#fff3cf;color:#8b5b05;border:1px solid #e8c577}
.foundation-progress-mark.is-unassessed{background:#eaf0f8;color:#476079;border:1px solid #b8cada}
.foundation-progress-mark.is-not_started{background:#f5f6f8;color:#64748b;border:1px solid #cbd5e1}
.foundation-progress-summary{margin:1rem 0}
.foundation-progress-summary .foundation-catalog-heading h2{margin:0}
.foundation-progress-summary progress{display:block;width:100%;height:.7rem;margin:.85rem 0;accent-color:#177a46}
.foundation-progress-stats{display:flex;flex-wrap:wrap;align-items:center;gap:.55rem 1rem;font-size:.9rem}
.foundation-progress-stats>span{white-space:nowrap}
.foundation-stats-check{color:#177a46;font-weight:800}
.foundation-progress-note{margin:.75rem 0 0;font-size:.83rem;line-height:1.5}
@media(max-width:600px){.foundation-progress-summary{padding:1rem}.foundation-progress-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;font-size:.82rem}.foundation-progress-stats>span{white-space:normal}.foundation-progress-mark{min-width:1.35rem;min-height:1.35rem}}


/* Learn by Units (60 CEFR Units). Same canonical Lesson player and saved attempts as Skill Library. */
.sle-unit-browser{max-width:1120px;margin:0 auto 36px;line-height:1.55;color:#20334d}
.sle-unit-browser button{font:inherit;cursor:pointer}
.sle-unit-browser button:focus-visible{outline:3px solid #c8a047;outline-offset:3px}
.sle-unit-browser .unit-browser-hero{border:1px solid #dbe6f2;background:#fff;border-radius:16px;padding:24px 28px}
.sle-unit-browser .unit-browser-hero h2{font-size:clamp(25px,3vw,36px);line-height:1.23;margin:8px 0 10px}
.sle-unit-browser .unit-browser-hero>p{color:#5e738d;margin:0 0 18px}
.sle-unit-browser .unit-browser-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sle-unit-browser .unit-browser-metrics>div{border:1px solid #e0e9f4;background:#f8fbff;border-radius:11px;padding:13px 15px;min-width:0}
.sle-unit-browser .unit-browser-metrics strong{display:block;font-size:25px;line-height:1.25;color:#164e89}
.sle-unit-browser .unit-browser-metrics span{font-size:12px;color:#6b7e97}
.sle-unit-browser .unit-level-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
.sle-unit-browser .unit-level-tabs button{border:1px solid #d4e2f1;background:#fff;color:#42637d;font-weight:700;border-radius:10px;padding:10px 19px;min-height:42px}
.sle-unit-browser .unit-level-tabs button.is-active{background:#194f91;color:#fff;border-color:#194f91}
.sle-unit-browser .unit-browser-heading{margin:6px 0 16px}
.sle-unit-browser .unit-browser-heading h3{font-size:20px;margin:0 0 3px}
.sle-unit-browser .unit-browser-heading p{color:#657a92;font-size:13px;margin:0}
.sle-unit-browser .unit-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sle-unit-browser .unit-card{min-width:0;display:flex;flex-direction:column;gap:11px;text-align:left;border:1px solid #dce6f3;background:#fff;padding:19px;border-radius:15px;min-height:145px;color:#223751;transition:border-color .15s,box-shadow .15s}
.sle-unit-browser .unit-card:hover{border-color:#477bb1;box-shadow:0 5px 18px #16477815}
.sle-unit-browser .unit-card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sle-unit-browser .unit-card-id{font-size:11px;color:#2c6fab;font-weight:750;letter-spacing:.035em}
.sle-unit-browser .unit-card-tag{background:#e9f3ff;color:#256396;border-radius:99px;font-size:11px;font-weight:750;white-space:nowrap;padding:5px 10px}
.sle-unit-browser .unit-card-tag.is-planned{background:#f0f3f7;color:#67798f}
.sle-unit-browser .unit-card>strong{font-size:17px;line-height:1.35;flex:1}
.sle-unit-browser .unit-card>small{font-size:12px;color:#718299}
.sle-unit-browser .unit-unmapped-note{color:#687d96;margin:17px 0;font-size:12px}
.sle-unit-browser .unit-back{margin:6px 0 18px;font-weight:700}
.sle-unit-browser .unit-detail-heading{padding:23px 26px;margin:0 0 17px;border-radius:15px}
.sle-unit-browser .unit-detail-heading h2{font-size:clamp(24px,3vw,30px);margin:8px 0;line-height:1.3}
.sle-unit-browser .unit-detail-heading p{margin:0 0 17px;color:#5c7088}
.sle-unit-browser .unit-detail-heading>small{display:block;color:#647b94;margin-top:10px}
.sle-unit-browser .unit-detail-counters{display:flex;gap:9px;flex-wrap:wrap}
.sle-unit-browser .unit-detail-counters span{border:1px solid #dce6f3;border-radius:9px;padding:7px 10px;font-size:12px;color:#54718d}
.sle-unit-browser .unit-detail-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(240px,.85fr);align-items:start;gap:16px}
.sle-unit-browser .unit-detail-grid>.panel,.sle-unit-browser .unit-detail-aside .panel{padding:22px;margin:0 0 14px;border-radius:15px}
.sle-unit-browser .unit-detail-grid h3{font-size:19px;margin:0 0 13px}
.sle-unit-browser .unit-lesson-row{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #e9eff7;padding:15px 0}
.sle-unit-browser .unit-lesson-row:first-of-type{border-top:0}
.sle-unit-browser .unit-lesson-info{min-width:0;display:flex;flex-direction:column;gap:5px}
.sle-unit-browser .unit-lesson-info strong{font-size:15px;line-height:1.4}
.sle-unit-browser .unit-lesson-info small{font-size:12px;color:#637b96}
.sle-unit-browser .unit-lesson-row .secondary-button{flex-shrink:0;white-space:nowrap;padding:10px 12px;min-height:42px}
.sle-unit-browser .unit-detail-aside{min-width:0}
.sle-unit-browser .unit-detail-aside ol{padding-left:20px;margin:0 0 13px}
.sle-unit-browser .unit-detail-aside li{margin-bottom:8px}
.sle-unit-browser .unit-detail-aside p{font-size:13px;color:#5d7390}
.sle-unit-browser .unit-checkpoint-note{border-left:4px solid #cfaa51;border-radius:7px;background:#fffaf1;padding:12px 14px}
.sle-unit-browser .unit-empty-note{padding:18px;border-radius:10px;background:#f4f8fc;color:#607893;line-height:1.6}
@media(max-width:900px){.sle-unit-browser .unit-detail-grid{grid-template-columns:1fr}}
@media(max-width:680px){
 .sle-unit-browser .unit-browser-hero{padding:18px 16px}
 .sle-unit-browser .unit-browser-metrics{gap:7px}
 .sle-unit-browser .unit-browser-metrics>div{padding:11px 9px}
 .sle-unit-browser .unit-browser-metrics strong{font-size:21px}
 .sle-unit-browser .unit-browser-metrics span{font-size:10px}
 .sle-unit-browser .unit-level-tabs{gap:6px}
 .sle-unit-browser .unit-level-tabs button{padding:10px 13px}
 .sle-unit-browser .unit-card-grid{grid-template-columns:1fr;gap:11px}
 .sle-unit-browser .unit-card{min-height:110px;padding:15px}
 .sle-unit-browser .unit-detail-heading{padding:18px 16px}
 .sle-unit-browser .unit-detail-grid>.panel,.sle-unit-browser .unit-detail-aside .panel{padding:18px 16px}
 .sle-unit-browser .unit-lesson-row{align-items:stretch;flex-direction:column;gap:10px}
 .sle-unit-browser .unit-lesson-row .secondary-button{align-self:flex-start}
}

/* A submission belongs to the Lesson ID, including scores from older curriculum releases. */
.foundation-recent-grid button .foundation-recent-top,
.sle-unit-browser .unit-lesson-status-head{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
.foundation-recent-grid button .foundation-recent-top .foundation-progress-mark>span,
.sle-unit-browser .unit-lesson-status-head .foundation-progress-mark>span{color:inherit;font-size:inherit}
.foundation-recent-grid button .foundation-recent-top>.foundation-lesson-id{font-size:.82rem}
.sle-unit-browser .unit-lesson-status-head{margin-bottom:2px}

/* Specialist courses are actual enrollable programmes, not a shortcut to all lessons. */
.course-choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;margin-top:18px}
.course-choice-card{background:#fff;border:1px solid #d9e5f3;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.course-choice-card h3{font-size:21px;line-height:1.35;margin:0;color:#163b69}
.course-choice-card p{color:#627a94;line-height:1.6;margin:0}
.course-choice-card .course-choice-progress{border-left:3px solid #5b87bb;background:#f3f8ff;padding:10px 12px;border-radius:4px;color:#2d5277}
.course-choice-card .learning-choices{margin:3px 0 0}
.course-choice-card button{min-height:42px}
@media(max-width:600px){.course-choice-card{padding:17px}.course-choice-card .learning-choices button{flex:1;min-width:fit-content}}


/* Parent View on-device storage UX: separate backup, safe cleanup, and restore. */
.sle-storage-panel{max-width:920px;min-width:0}
.sle-storage-intro{line-height:1.65}
.sle-storage-section{padding:16px 0;border-top:1px solid #e4ebf5}
.sle-storage-action-row{display:grid;grid-template-columns:minmax(205px,265px) minmax(0,1fr);align-items:center;gap:12px 22px}
.sle-storage-action-row>.secondary-button{width:100%;min-height:46px;white-space:normal;text-align:center;line-height:1.4}
.sle-storage-action-row p{margin:0;font-size:14px;line-height:1.65;overflow-wrap:anywhere}
.sle-storage-preview{margin:15px 0 0;padding:16px;border:1px solid #dce7f3;border-radius:12px;background:#f7faff}
.sle-storage-preview h3,.sle-cleanup-steps h3{font-size:16px;color:#1d426d;margin:0 0 11px}
.sle-storage-preview p{font-size:14px;margin:8px 0;line-height:1.65}
.sle-storage-no-savings{margin-top:14px!important;border-left:3px solid #6e8ea8;padding:11px 13px;background:#fff;color:#345571!important}
.sle-cleanup-steps{display:grid;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid #dce6f1}
.sle-cleanup-step{display:grid;grid-template-columns:minmax(205px,265px) minmax(0,1fr);gap:6px 22px;align-items:center;padding:8px 0}
.sle-cleanup-step>.secondary-button{width:100%;min-height:46px;white-space:normal;line-height:1.4}
.sle-cleanup-step p{margin:0;font-size:14px;line-height:1.6}
.sle-storage-verified-file{grid-column:2;color:#237a58;font-size:13px;overflow-wrap:anywhere}
.sle-storage-filename{font-size:13px;margin:8px 0 0;overflow-wrap:anywhere}
.sle-restore-confirmation{margin-top:12px;padding:14px;background:#f7faff;border:1px solid #dce7f3;border-radius:10px}
.sle-restore-confirmation p{margin:0 0 10px;font-size:14px}
.sle-storage-footnote{margin:14px 0 0!important;line-height:1.65}
.sle-storage-status{margin:13px 0 0;padding:12px 14px;border:1px solid #d3e3f4;border-radius:9px;background:#f2f7fd;overflow-wrap:anywhere}
.sle-storage-hidden-file{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;overflow:hidden!important;pointer-events:none!important}
.sle-storage-panel .secondary-button:focus-visible{outline:3px solid #80a8e5;outline-offset:3px}
@media(max-width:680px){
 .sle-storage-action-row,.sle-cleanup-step{grid-template-columns:minmax(0,1fr);gap:7px}
 .sle-storage-action-row>.secondary-button,.sle-cleanup-step>.secondary-button{width:100%;text-align:center}
 .sle-storage-verified-file{grid-column:1}
 .sle-storage-preview{padding:13px}
}

/* SLE P1 Reference Library: static lookup UI, no learner-scoring state. */
.sle-reference{min-width:0}
.sle-reference .sle-reference-intro{line-height:1.55}
.sle-reference .sle-reference-filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sle-reference .sle-reference-filter-grid label{display:flex;flex-direction:column;gap:7px;font-weight:600;min-width:0}
.sle-reference .sle-reference-filter-grid input,
.sle-reference .sle-reference-filter-grid select{width:100%;min-width:0;box-sizing:border-box;padding:12px;border:1px solid #b1bfd1;border-radius:9px;background:#fff;color:#183451;font:inherit}
.sle-reference .sle-reference-search-summary{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:9px;margin-top:12px}
.sle-reference .sle-reference-section{margin-top:20px;min-width:0}
.sle-reference .sle-reference-table-scroll{max-width:100%;overflow-x:auto;overscroll-behavior-inline:contain;border:1px solid #d7e1ed;border-radius:9px}
.sle-reference .sle-reference-table-scroll:focus-visible{outline:3px solid #2a6cac;outline-offset:2px}
.sle-reference table{width:100%;min-width:690px;border-collapse:collapse;line-height:1.48}
.sle-reference th,.sle-reference td{padding:12px;text-align:left;vertical-align:top;border-bottom:1px solid #e1e8f0}
.sle-reference th{font-weight:700}
.sle-reference thead{background:#e9f2fb}
.sle-reference tbody tr:last-child>*{border-bottom:0}
.sle-reference td p{margin:7px 0}
.sle-reference .sle-reference-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin-top:13px}
.sle-reference .sle-reference-card{min-width:0;overflow-wrap:anywhere}
.sle-reference .sle-reference-card h3{font-size:1.14rem;margin:10px 0}
.sle-reference .sle-reference-card p{line-height:1.55}
.sle-reference .sle-reference-tags{display:flex;flex-wrap:wrap;gap:7px}
.sle-reference .sle-reference-tags span{font-size:.79rem;background:#eff5fc;border-radius:16px;padding:4px 9px;color:#315479}
.sle-reference .sle-reference-practice{margin-top:10px;overflow-wrap:anywhere}
.sle-reference .sle-reference-practice .text-button{text-align:left;white-space:normal;min-height:40px}
.sle-reference .sle-reference-footer{margin-top:18px;line-height:1.5}
@media(max-width:680px){
 .sle-reference .sle-reference-filter-grid{grid-template-columns:1fr}
 .sle-reference .sle-reference-search-summary .secondary-button{min-height:42px}
 .sle-reference table{min-width:640px}
 .sle-reference th,.sle-reference td{padding:10px}
}

/* Reference category chips: color reinforces the printed text, never the only cue. */
.sle-reference .sle-reference-category-filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sle-reference .sle-reference-category-filter{
 --ref-kind-bg:#eef1f5;--ref-kind-fg:#253c55;--ref-kind-border:#a6b2bf;
 background:var(--ref-kind-bg);color:var(--ref-kind-fg);
 border:1px solid var(--ref-kind-border);border-radius:999px;
 padding:9px 13px;min-height:42px;font:inherit;font-size:.88rem;font-weight:650;
 line-height:1.2;cursor:pointer;white-space:normal;text-align:center
}
.sle-reference .is-irregular_verbs{--ref-kind-bg:#e4eeff;--ref-kind-fg:#164883;--ref-kind-border:#6f97cc}
.sle-reference .is-collocations{--ref-kind-bg:#e0f5eb;--ref-kind-fg:#13603d;--ref-kind-border:#77ad8d}
.sle-reference .is-phrasal_verbs{--ref-kind-bg:#fff0dd;--ref-kind-fg:#78420c;--ref-kind-border:#c6985f}
.sle-reference .is-idioms{--ref-kind-bg:#f2e9ff;--ref-kind-fg:#60348c;--ref-kind-border:#ab91c9}
.sle-reference .is-common_mistakes{--ref-kind-bg:#ffe9e8;--ref-kind-fg:#8a3437;--ref-kind-border:#ce8e90}
.sle-reference .is-learning_tips{--ref-kind-bg:#dff5f6;--ref-kind-fg:#155c67;--ref-kind-border:#78b1bb}
.sle-reference .sle-reference-category-filter:hover{filter:brightness(.95)}
.sle-reference .sle-reference-category-filter.is-selected{
 border-width:2px;padding:8px 12px;box-shadow:0 0 0 1px var(--ref-kind-fg);
 text-decoration:underline;text-underline-offset:3px
}
.sle-reference .sle-reference-category-filter:focus-visible{
 outline:3px solid #254f84;outline-offset:3px
}
.sle-reference .sle-reference-kind-label{
 color:var(--ref-kind-fg);background:var(--ref-kind-bg);
 border:1px solid var(--ref-kind-border);font-weight:700
}
@media(max-width:400px){
 .sle-reference .sle-reference-category-filters{gap:7px}
 .sle-reference .sle-reference-category-filter{padding:8px 10px;min-height:44px;font-size:.82rem}
 .sle-reference .sle-reference-category-filter.is-selected{padding:7px 9px}
}

/* Integrated Writing: canonical sources displayed where the answer is entered. */
.writing-source-bundle{margin:1rem 0 1.25rem;min-width:0}
.writing-source-bundle>p{line-height:1.65;overflow-wrap:anywhere}
.writing-source-step{min-width:0;margin:1rem 0;padding:.85rem 0;border-top:1px solid #dce7f5}
.writing-source-step h4{font-size:1rem;color:#163c66;margin:0 0 .65rem}
.writing-source-step .foundation-passage{max-width:100%;margin:.8rem 0;overflow-wrap:anywhere}
.writing-source-step .foundation-passage h5{font-size:.94rem;margin:0 0 .65rem;color:#214c7c}
.writing-source-step audio{display:block;width:100%;max-width:480px;margin:.6rem 0}
.writing-source-step>p{margin:.35rem 0;line-height:1.65}
.writing-source-optional-lessons{margin-top:1rem;border-top:1px solid #dce7f5;padding-top:.8rem}
.writing-source-optional-lessons summary{cursor:pointer;color:#245aa8;font-weight:650;line-height:1.5}
.writing-source-optional-lessons .learning-choices{margin:.65rem 0;gap:.6rem}
.writing-source-optional-lessons .learning-choices button{white-space:normal;min-height:44px;max-width:100%;text-align:left}
@media(max-width:680px){
 .writing-source-step .foundation-passage{padding:.9rem}
 .writing-source-step audio{max-width:100%}
 .writing-source-optional-lessons .learning-choices button{width:100%}
}


/* Reviewed Vocabulary A1/A2/B1 pilot: compact instructional cards, no scored mutation. */
.sle-vocab-pilot{margin:1rem 0 1.25rem;max-width:920px;min-width:0}
.sle-vocab-pilot>p{overflow-wrap:anywhere;line-height:1.65}
.sle-vocab-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:.7rem;margin:.9rem 0}
.sle-vocab-card{background:#fff;border:1px solid #d6e4f3;border-radius:10px;padding:.9rem;min-width:0}
.sle-vocab-card h4{font-size:1rem;margin:0 0 .5rem;color:#184d86;overflow-wrap:anywhere}
.sle-vocab-card p{margin:.4rem 0;line-height:1.5;overflow-wrap:anywhere}
.sle-vocab-card .sle-vocab-contrast{font-size:.92rem;color:#49627d}
.sle-vocab-demo{padding:.9rem;border-left:3px solid #527fb9;background:#edf4fd;border-radius:6px}
.sle-vocab-demo h4{margin:0 0 .45rem;font-size:1rem}
.sle-vocab-demo p{margin:0;line-height:1.65}
.sle-vocab-self-practice{margin:1rem 0;border:1px solid #d6e4f3;border-radius:9px;padding:.85rem;background:#fff}
.sle-vocab-self-practice summary{cursor:pointer;min-height:44px;font-weight:650}
.sle-vocab-self-practice summary:focus-visible{outline:3px solid #316cba;outline-offset:2px}
.sle-vocab-self-practice p{margin:.7rem 0;line-height:1.55;overflow-wrap:anywhere}
.sle-vocab-repair{border-top:1px solid #d6e4f3;margin-top:.75rem;padding:.65rem 0}
.sle-vocab-repair p{margin:.35rem 0;line-height:1.55}
.sle-vocab-repair small{display:block;color:#526c84}
@media(max-width:380px){.sle-vocab-card{padding:.75rem}.sle-vocab-demo{padding:.75rem}}


/* Learner results: one explanation on Dashboard, useful next steps in result cards. */
.dashboard-progress-guidance{margin:18px 0 22px;border:1px solid #d5e3f2;border-radius:12px;background:#f7faff;padding:15px 18px;color:#294969;font-size:16px;line-height:1.55}
.dashboard-progress-guidance strong{font-size:16px;font-weight:750}
.dashboard-progress-guidance p{margin:5px 0 0;font-size:16px;line-height:1.55}
.foundation-offline-review{max-width:920px;margin:1.25rem 0;padding:23px 26px;font-size:16px;line-height:1.6}
.foundation-offline-review h3{font-size:20px;line-height:1.4;margin:0 0 13px;color:#193b61}
.foundation-offline-review p,.foundation-offline-review li,.foundation-offline-review strong{font-size:16px;line-height:1.6}
.foundation-offline-review p{margin:8px 0}
.foundation-review-actions{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px}
.foundation-review-actions>li{background:#f5f9ff;border:1px solid #d6e5f5;border-radius:11px;padding:14px 17px;min-width:0}
.foundation-review-action-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.foundation-review-action-head strong{color:#204c7d;font-weight:750}
.foundation-review-action-head .secondary-button{font-size:16px;min-height:42px;white-space:normal}
.foundation-review-actions>li p{margin:7px 0 0;overflow-wrap:anywhere}
.foundation-lesson .exercise>strong,.foundation-lesson .sle-vocab-repair>strong{font-size:16px}
@media(max-width:600px){
 .dashboard-progress-guidance{padding:13px 14px}
 .foundation-offline-review{padding:16px}
 .foundation-review-actions>li{padding:12px}
 .foundation-review-action-head{align-items:flex-start}
}


/* Independent academic R/G/W depth pilot: reviewed teaching only, no scoring UI. */
.sle-rgw-pilot{margin:1rem 0 1.2rem;max-width:920px;min-width:0;font-size:16px;line-height:1.6}
.sle-rgw-pilot>p{margin:.6rem 0;overflow-wrap:anywhere}
.sle-rgw-strategies{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:.7rem;margin:1rem 0}
.sle-rgw-strategy{min-width:0;background:white;border:1px solid #d6e4f3;border-radius:10px;padding:14px 16px}
.sle-rgw-strategy h4{font-size:16px;line-height:1.45;margin:0 0 .4rem;color:#194c83}
.sle-rgw-strategy p,.sle-rgw-pilot li{font-size:16px;line-height:1.6;margin:.35rem 0;overflow-wrap:anywhere}
.sle-rgw-model{border-left:3px solid #4277b9;background:#edf4fc;border-radius:8px;padding:14px 16px;min-width:0}
.sle-rgw-model h4,.sle-rgw-brainstorm h4{font-size:16px;margin:0 0 .55rem;color:#194c83}
.sle-rgw-model p{font-size:16px;line-height:1.6;margin:.45rem 0;overflow-wrap:anywhere}
.sle-rgw-model-thinking{white-space:pre-line}
.sle-rgw-brainstorm{margin:.8rem 0;padding:14px 16px;background:#f5f9ff;border:1px solid #d6e4f3;border-radius:10px}
.sle-rgw-brainstorm ol{padding-left:23px;margin:.45rem 0}
.sle-rgw-self-practice{margin:1rem 0;background:white;border:1px solid #d6e4f3;border-radius:10px;padding:13px 16px}
.sle-rgw-self-practice summary{cursor:pointer;min-height:44px;display:list-item;font-size:16px;font-weight:700;line-height:1.6}
.sle-rgw-self-practice summary:focus-visible,.sle-rgw-checklist input:focus-visible{outline:3px solid #3272bc;outline-offset:3px}
.sle-rgw-self-practice p{font-size:16px;line-height:1.6}
.sle-rgw-checklist{display:grid;gap:9px}
.sle-rgw-checklist label{display:flex;align-items:flex-start;gap:10px;line-height:1.55;font-size:16px;cursor:pointer}
.sle-rgw-checklist input{width:18px;height:18px;flex-shrink:0;margin:4px 0 0}
.sle-rgw-unscored,.sle-rgw-start-note{color:#4d667f;font-size:15px;line-height:1.5}
@media(max-width:380px){
 .sle-rgw-pilot,.sle-rgw-strategy,.sle-rgw-model,.sle-rgw-self-practice{min-width:0}
 .sle-rgw-strategy,.sle-rgw-model,.sle-rgw-brainstorm,.sle-rgw-self-practice{padding:11px 12px}
 .sle-rgw-strategies{gap:.5rem}
}


/* SLE Writing Week 2: learner-owned visual idea map, no graph library or scoring. */
.w2-map {overflow-wrap:anywhere}
.w2-map .muted {margin:0 0 16px}
.w2-map-root {position:relative;margin:12px auto 0;padding:16px 18px;max-width:520px;
  border:2px solid #3d73b6;background:#eaf3ff;border-radius:15px;text-align:center;min-width:0}
.w2-map-root p {font-weight:700;line-height:1.45;margin:5px 0 0;color:#21496f}
.w2-map-kicker {display:block;font-size:11px;font-weight:800;letter-spacing:.07em;color:#345e8c}
.w2-map-branches {display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0;
  margin:0;padding:20px 0 0 14px;border-left:2px solid #b9d0e6}
.w2-map-branch {position:relative;min-width:0;border:1px solid #b9d0e6;border-radius:13px;
  background:#f8fbff;padding:14px;overflow-wrap:anywhere}
.w2-map-branch::before {content:"";position:absolute;left:-16px;top:25px;width:15px;
  height:2px;background:#b9d0e6}
.w2-map-branch h4 {margin:0 0 12px;color:#234d79}
.w2-map-decision {border-color:#7bb8a4;background:#f3faf6}
.w2-map-filtered {border-color:#d6c39c;background:#fffaf1}
.w2-map-idea-list {list-style:none;display:grid;gap:8px;margin:0;padding:0;min-width:0}
.w2-map-idea {border:1px solid #d6e4f2;border-radius:9px;padding:10px;
  display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-width:0;background:#fff}
.w2-map-idea.w2-map-chosen {border-color:#6bae96;background:#ecf8f0}
.w2-map-idea-text {display:block;flex:1 1 100%;font-weight:600;min-width:0;overflow-wrap:anywhere}
.w2-map-tag {font-size:12px;color:#34567b;background:#eaf3ff;padding:2px 7px;border-radius:999px}
.w2-map-idea button {min-height:40px;border:1px solid #a9c8e1;background:#f8fcff;
  border-radius:8px;padding:7px 10px;color:#234f7b;white-space:normal;font-weight:700}
.w2-map-idea button:focus-visible {outline:3px solid #266dc3;outline-offset:2px}
.w2-map-idea button:disabled {background:#e7f5ed;color:#2b6d55}
.w2-map-note {font-size:13px;color:#47627e;margin:8px 0}
.w2-map-value {font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.w2-map-original {white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}
.w2-map-subnode {margin-top:14px;padding:12px;border-left:3px solid #77ad91;border-radius:7px;background:#fff}
.w2-map-subnode p {margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.w2-map-footnote {margin:12px 0 0;font-size:13px;color:#546e87}
@media (min-width:900px) {
  .w2-map-root::after {content:"";position:absolute;left:50%;bottom:-20px;height:18px;width:2px;background:#b9d0e6}
  .w2-map-branches {grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-left:0;
    padding:28px 0 0;position:relative}
  .w2-map-branches::before {content:"";position:absolute;top:19px;left:16.66%;right:16.66%;
    border-top:2px solid #b9d0e6}
  .w2-map-branch::before {left:50%;top:-10px;width:2px;height:10px}
}

/* Week 2 reviewer suggestion: compact task map on narrow screens only. */
.w2-map-drawer {min-width:0}
.w2-map-drawer>summary {display:none}
@media (max-width:379px) {
  .w2-map-drawer>summary {
    display:list-item;
    cursor:pointer;
    min-height:44px;
    padding:12px 13px;
    border:1px solid #b9d0e6;
    background:#eef5ff;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
    line-height:1.5;
    color:#234d79;
    overflow-wrap:anywhere;
  }
  .w2-map-drawer>summary:focus-visible {outline:3px solid #266dc3;outline-offset:3px}
  .w2-map-drawer[open]>summary {margin-bottom:8px}

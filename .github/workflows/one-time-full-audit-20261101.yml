name: ONE-TIME comprehensive 1.18 release audit (2026-11-01)
on:
  push:
    branches:
      - release/nov2026-content-v1.18.0
    paths:
      - .github/workflows/one-time-full-audit-20261101.yml
permissions:
  contents: read
concurrency:
  group: english-one-time-full-audit-20261101
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - name: Verify source is complete
        run: |
          test -f content/curriculum-1.18.0-candidate.json
          test -f scripts/qa-audit-aggregated.mjs
          test -f content/audio-rights-register.json
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sites-p0-phase-a-20260926/pnpm-lock.yaml
      - name: Install exact dependencies once
        run: pnpm install --frozen-lockfile
      - name: Run ALL QA and collect full failure list
        run: node scripts/qa-audit-aggregated.mjs
      - name: Preserve diagnostic test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-nov-1180-full-qa-audit-20261101
          path: sites-p0-phase-a-20260926/docs/qa/nov1180-aggregate-audit.json
          if-no-files-found: warn
          retention-days: 7

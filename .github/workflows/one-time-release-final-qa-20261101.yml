name: ONE-TIME 1.18 release QA after FFmpeg fix
on:
  push:
    branches:
      - release/nov2026-content-v1.18.0
    paths:
      - .github/workflows/one-time-release-final-qa-20261101.yml
permissions:
  contents: read
concurrency:
  group: english-final-qa-20261101
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - name: Verify release source
        run: |
          test -f content/curriculum-1.18.0-candidate.json
          test -f tests/nov-2026-content-preflight.cjs
          test -f content/audio-rights-register.json
      - name: Install FFmpeg for legacy codec QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sites-p0-phase-a-20260926/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run REAL final release QA (including full regression, tsc, Firebase build)
        run: pnpm qa:release

name: Grammar B1 Wave 2B Draft QA
on:
  pull_request:
    paths:
      - 'sites-p0-phase-a-20260926/content/batches/grammar-b1-wave2b.json'
      - 'sites-p0-phase-a-20260926/content/review-packets/EN-GRA-B1-W2B-20261004.md'
      - 'sites-p0-phase-a-20260926/content/grammar-roadmap-v1.json'
      - 'sites-p0-phase-a-20260926/scripts/render-notebooklm-review.mjs'
      - 'sites-p0-phase-a-20260926/tests/grammar-b1-wave2b-draft.cjs'
      - 'sites-p0-phase-a-20260926/docs/NOTEBOOKLM_GRAMMAR_B1_WAVE2B_REVIEW.md'
      - '.github/workflows/grammar-b1-wave2b-draft-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Wave 2B draft and NotebookLM-source gate
        run: node tests/grammar-b1-wave2b-draft.cjs
      - name: Existing reviewed curriculum regressions
        run: node tests/curriculum-170-grammar-b1-wave2a.cjs && node tests/batch04-code-compat.cjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false

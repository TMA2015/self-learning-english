name: ONE-TIME English Feedback Safe QA and LIVE
on:
  push:
    branches:
      - ops/english-feedback-safe-qa-20261101
    paths:
      - .github/workflows/english-feedback-safe-qa-20261101.yml
permissions:
  contents: read
jobs:
  qa-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - name: Lock source to approved release candidate
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin d826e4eb344b23fe9779ae6602a49b301cc5ffad
          test "$(git diff --name-only d826e4eb344b23fe9779ae6602a49b301cc5ffad HEAD)" = ".github/workflows/english-feedback-safe-qa-20261101.yml"
      - name: Verify English Hosting only
        run: |
          node --input-type=commonjs - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const cfg=JSON.parse(fs.readFileSync('firebase.json','utf8')),rc=JSON.parse(fs.readFileSync('.firebaserc','utf8'));
          assert.equal(cfg.hosting.target,'english');
          assert.equal(cfg.hosting.public,'dist/client');
          assert.equal(rc.projects.default,'roadmap-toan-ai');
          assert.deepEqual(rc.targets['roadmap-toan-ai'].hosting.english,['g-learning-english']);
          NODE
      - name: Firebase credentials must already exist
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
        run: test -n "$SA"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Complete strict QA and TypeScript build
        run: pnpm qa:release
      - name: Verify safe Writing feedback and audio assets
        run: |
          node tests/writing-course-v2-a.cjs
          node tests/writing-step-feedback-ux.cjs
          test -s dist/client/index.html
          test -s dist/client/foundation-audio/LIS-A2-01-v2.mp3
          test -s dist/client/foundation-audio/LIS-B1-01-v2.mp3
      - name: Deploy English Hosting LIVE only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
          projectId: roadmap-toan-ai
          target: english
          entryPoint: sites-p0-phase-a-20260926
          channelId: live
          disableComment: true
          firebaseToolsVersion: "15.32.1"
      - name: Check live website and existing audio
        run: |
          set -euo pipefail
          sleep 15
          root="https://g-learning-english.web.app"
          for asset in / /foundation-audio/LIS-A2-01-v2.mp3 /foundation-audio/LIS-B1-01-v2.mp3; do
            curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 6 --retry-max-time 100 --output /dev/null "$root$asset"
          done
          echo "ENGLISH_FEEDBACK_LIVE_HTTP_PASS"
      - name: Record scope
        if: ${{ success() }}
        run: |
          echo "English Writing feedback source: d826e4eb344b23fe9779ae6602a49b301cc5ffad" >> "$GITHUB_STEP_SUMMARY"
          echo "Full QA/build and English-only LIVE deploy: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Model grading semantic accuracy requires separate human academic QA" >> "$GITHUB_STEP_SUMMARY"

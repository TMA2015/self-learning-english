name: GitHub-first G2 Static Export QA

on:
  pull_request:
    paths:
      - 'sites-p0-phase-a-20260926/app/**'
      - 'sites-p0-phase-a-20260926/application/guided-writing.ts'
      - 'sites-p0-phase-a-20260926/application/writing-practice.ts'
      - 'sites-p0-phase-a-20260926/infrastructure/browser/**'
      - 'sites-p0-phase-a-20260926/next.config.ts'
      - 'sites-p0-phase-a-20260926/public/**'
      - 'sites-p0-phase-a-20260926/tests/github-first-g2-static-export.cjs'
      - 'sites-p0-phase-a-20260926/scripts/stage-github-pages.mjs'
      - '.github/workflows/github-first-g2-static-export-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    env:
      GITHUB_PAGES_EXPORT: '1'
      NEXT_PUBLIC_LEARNING_RUNTIME: browser
      NEXT_PUBLIC_BASE_PATH: /self-learning-english
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Build static GitHub Pages artifact
        run: pnpm run build
      - name: Inspect static output layout
        run: |
          echo "=== dist/client ==="
          find dist/client -maxdepth 4 -type f | sort | sed -n '1,240p'
      - name: Stage GitHub Pages project-site artifact
        run: node scripts/stage-github-pages.mjs
      - name: Verify artifact, base path, static audio and secret safety
        run: node tests/github-first-g2-static-export.cjs

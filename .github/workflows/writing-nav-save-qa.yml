name: Writing navigation and draft feedback QA

on:
  pull_request:
    paths:
      - 'sites-p0-phase-a-20260926/app/page.tsx'
      - 'sites-p0-phase-a-20260926/app/platform.tsx'
      - 'sites-p0-phase-a-20260926/app/foundation.tsx'
      - 'sites-p0-phase-a-20260926/app/globals.css'
      - 'sites-p0-phase-a-20260926/tests/writing-nav-save-feedback.cjs'
      - '.github/workflows/writing-nav-save-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Check consistent Writing layout and server-confirmed draft status
        run: node tests/writing-nav-save-feedback.cjs
      - name: Guard existing v14 player and catalog
        run: node tests/attempt-navigation-ui.cjs && node tests/catalog-groups.cjs && node tests/catalog-taxonomy-ui.cjs
      - name: Production build, no Site deployment
        run: pnpm run build

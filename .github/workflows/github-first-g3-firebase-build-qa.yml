name: GitHub-first G3 Firebase Build QA

on:
  pull_request:
    paths:
      - 'sites-p0-phase-a-20260926/app/**'
      - 'sites-p0-phase-a-20260926/application/**'
      - 'sites-p0-phase-a-20260926/ai/**'
      - 'sites-p0-phase-a-20260926/infrastructure/ai/**'
      - 'sites-p0-phase-a-20260926/infrastructure/browser/**'
      - 'sites-p0-phase-a-20260926/next.config.ts'
      - 'sites-p0-phase-a-20260926/vite.config.ts'
      - 'sites-p0-phase-a-20260926/firebase.json'
      - 'sites-p0-phase-a-20260926/public/**'
      - 'sites-p0-phase-a-20260926/tests/firebase-ai-logic-provider.cjs'
      - 'sites-p0-phase-a-20260926/tests/github-first-g3-firebase-hosting.cjs'
      - '.github/workflows/github-first-g3-firebase-build-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    env:
      STATIC_EXPORT: '1'
      NEXT_PUBLIC_LEARNING_RUNTIME: browser
      NEXT_PUBLIC_BASE_PATH: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Firebase AI provider boundary
        run: node tests/firebase-ai-logic-provider.cjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Build root static artifact
        run: pnpm run build
      - name: Verify Firebase Hosting artifact
        run: node tests/github-first-g3-firebase-hosting.cjs

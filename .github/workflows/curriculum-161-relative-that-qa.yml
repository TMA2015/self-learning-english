name: Curriculum 1.6.1 Relative-Clause Hotfix QA
on:
  pull_request:
    paths:
      - 'sites-p0-phase-a-20260926/content/curriculum-1.6.1-candidate.json'
      - 'sites-p0-phase-a-20260926/content/grammar-1601-relative-that-hotfix-draft.json'
      - 'sites-p0-phase-a-20260926/notebooklm/GRAMMAR_1601_RELATIVE_THAT_HOTFIX.txt'
      - 'sites-p0-phase-a-20260926/tests/curriculum-161-relative-that.cjs'
      - '.github/workflows/curriculum-161-relative-that-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Curriculum 1.6.1 hotfix candidate
        run: node tests/curriculum-161-relative-that.cjs
      - name: Existing academic/content regressions
        run: node tests/academic.cjs && node tests/content-quality.cjs && node tests/curriculum.cjs
      - name: TypeScript and production build
        run: pnpm exec tsc --noEmit --incremental false && pnpm run build

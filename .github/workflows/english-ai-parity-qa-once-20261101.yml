name: ONE-TIME English AI Math-Parity QA (No Deploy)
on:
  push:
    branches:
      - ops/english-ai-parity-qa-once-20261101
    paths:
      - .github/workflows/english-ai-parity-qa-once-20261101.yml
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - name: Verify source matches approved candidate exactly
        env:
          EXPECTED_SOURCE: d790bc9018853f332346a4c393e56a6c52d9ad27
        run: |
          set -euo pipefail
          cd ..
          git fetch --no-tags --depth=1 origin "$EXPECTED_SOURCE"
          test "$(git diff --name-only "$EXPECTED_SOURCE" HEAD)" = ".github/workflows/english-ai-parity-qa-once-20261101.yml"
          echo "SOURCE_MATCH_PASS $EXPECTED_SOURCE"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install frozen deps
        run: pnpm install --frozen-lockfile
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Full QA for content and English AI
        run: pnpm qa:release
      - name: Assert knowledge-only AI and English app isolation
        run: |
          node tests/english-tutor-knowledge-only.cjs
          node tests/g3-firebase-browser-bridge.cjs
          echo "AI_PARITY_SOURCE_QA_PASS — real App Check still requires production attestation"

name: Importer Capacity 150 QA
on:
  pull_request:
    paths:
      - 'sites-p0-phase-a-20260926/domain/academic.ts'
      - 'sites-p0-phase-a-20260926/scripts/compose-curriculum.mjs'
      - 'sites-p0-phase-a-20260926/app/api/admin/content-import/route.ts'
      - 'sites-p0-phase-a-20260926/app/foundation.tsx'
      - 'sites-p0-phase-a-20260926/tests/importer-capacity-150.cjs'
      - '.github/workflows/importer-capacity-150-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: 150-lesson importer stress test
        run: node tests/importer-capacity-150.cjs
      - name: Existing academic/content regressions
        run: node tests/academic.cjs && node tests/content-quality.cjs && node tests/curriculum.cjs && node tests/run.cjs
      - name: Version-aware and learning-evidence regressions
        run: node tests/version-aware-attempt-ux.cjs && node tests/practice-progress-p2a.cjs && node tests/course-v21-p1.cjs
      - name: Writing and assisted-review regressions
        run: node tests/writing-tutor.cjs && node tests/assisted-review.cjs
      - name: TypeScript and production build
        run: pnpm exec tsc --noEmit --incremental false && pnpm run build

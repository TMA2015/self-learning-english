name: G3-D Firebase Hosting Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    env:
      STATIC_EXPORT: '1'
      NEXT_PUBLIC_LEARNING_RUNTIME: browser
      NEXT_PUBLIC_BASE_PATH: ''
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run G3 Firebase browser contract
        run: node tests/g3-firebase-browser-bridge.cjs

      - name: Run regression suite
        run: node tests/run.cjs

      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false

      - name: Build static Hosting artifact
        run: pnpm run build

      - name: Deploy English preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}'
          projectId: roadmap-toan-ai
          target: english
          entryPoint: sites-p0-phase-a-20260926
          channelId: g3-d-first-release
          expires: 7d

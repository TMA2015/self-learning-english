name: ONE-TIME Self-Learning English 1.18 QA (2026-11-01)
on:
  push:
    branches:
      - release/nov2026-content-v1.18.0
    paths:
      - .github/workflows/one-time-release-qa-20261101.yml
permissions:
  contents: read
concurrency:
  group: english-one-time-qa-20261101
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - name: Confirm complete source and no production deploy
        run: |
          test -f content/curriculum-1.18.0-candidate.json
          test -f tests/audio-rights-release-gate.cjs
          test -f tests/nov-2026-content-preflight.cjs
      - name: Verify release content and audio fingerprints
        run: |
          node tests/nov-2026-content-preflight.cjs
          node tests/audio-rights-release-gate.cjs
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sites-p0-phase-a-20260926/pnpm-lock.yaml
      - name: Install locked dependencies once
        run: pnpm install --frozen-lockfile
      - name: Run consolidated release quality checks
        run: pnpm qa:release

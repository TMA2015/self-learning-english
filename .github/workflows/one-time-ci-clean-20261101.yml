name: ONE-TIME CI green confirmation for English v1.18 (2026-11-01)
on:
  push:
    branches:
      - release/nov2026-content-v1.18.0
    paths:
      - .github/workflows/one-time-ci-clean-20261101.yml
permissions:
  contents: read
concurrency:
  group: english-ci-green-confirmation-20261101
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - name: Verify full 1.18 app
        run: |
          test -f content/curriculum-1.18.0-candidate.json
          test -f content/audio-rights-register.json
      - name: Install ffprobe for audio regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies once, without fragile cache
        run: pnpm install --frozen-lockfile
      - name: Consolidated release QA, TS, and static Firebase build
        run: pnpm qa:release

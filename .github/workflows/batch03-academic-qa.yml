name: Academic Batch03 QA

on:
  pull_request:
    paths:
      - 'sites-p0-phase-a-20260926/content/batches/batch03-*.json'
      - 'sites-p0-phase-a-20260926/content/curriculum-1.3.0-candidate.json'
      - 'sites-p0-phase-a-20260926/content/curriculum-coverage-1.3.0-candidate.json'
      - 'sites-p0-phase-a-20260926/content/lesson-groups-1.3.0-candidate.json'
      - 'sites-p0-phase-a-20260926/content/reviews/batch03-*.json'
      - 'sites-p0-phase-a-20260926/domain/academic.ts'
      - 'sites-p0-phase-a-20260926/tests/content-batch03.cjs'
      - '.github/workflows/batch03-academic-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify 1.3 content and 1.2 production immutability
        run: node tests/content-batch03.cjs
      - name: Validate legacy Batch02 academic files
        run: node tests/content-batch02.cjs
      - name: Production build without content import or deployment
        run: pnpm run build

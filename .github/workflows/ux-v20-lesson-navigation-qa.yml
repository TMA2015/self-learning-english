name: UX v20 Lesson IDs and Navigation QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify v20 ID, cache, saved-draft and catalog navigation contracts
        run: node tests/v20-route-draft-safety.cjs && node tests/ux-v20-lesson-navigation.cjs && node tests/attempt-navigation-ui.cjs && node tests/writing-nav-save-feedback.cjs && node tests/catalog-taxonomy-ui.cjs && node tests/batch02-v11-release.cjs && node tests/foundation-coaching.cjs && node tests/foundation-results-ux.cjs
      - name: Preserve listening, curriculum and Batch04 code compatibility
        run: node tests/listening-submit-feedback.cjs && node tests/listening-retake-audio-readiness.cjs && node tests/catalog-groups.cjs && node tests/curriculum-13-compat-v15.cjs && node tests/batch04-code-compat.cjs
      - name: Production build only; no Site deployment or data import
        run: pnpm run build

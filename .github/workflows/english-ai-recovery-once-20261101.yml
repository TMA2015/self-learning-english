name: ONE TIME English AI recovery release

on:
  push:
    branches:
      - ops/english-ai-recovery-once-20261101
    paths:
      - .github/workflows/english-ai-recovery-once-20261101.yml

permissions:
  contents: read

concurrency:
  group: g-learning-english-ai-recovery
  cancel-in-progress: false

jobs:
  qa-and-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify exact candidate source, one-shot workflow change only
        env:
          EXPECTED_SOURCE: 7572807cd0ac5b104d67d53db871a8c015115f9b
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/ops/english-ai-recovery-once-20261101"
          git fetch --no-tags --depth=1 origin "$EXPECTED_SOURCE"
          test "$(git diff --name-only "$EXPECTED_SOURCE" HEAD)" = ".github/workflows/english-ai-recovery-once-20261101.yml"
          echo "CANDIDATE_SHA_VERIFIED $EXPECTED_SOURCE"

      - name: Check Firebase English-only Hosting identity
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const cfg=JSON.parse(fs.readFileSync('firebase.json','utf8'));
          const rc=JSON.parse(fs.readFileSync('.firebaserc','utf8'));
          a.equal(cfg.hosting.target,'english');
          a.equal(cfg.hosting.public,'dist/client');
          a.equal(rc.projects.default,'roadmap-toan-ai');
          a.deepEqual(rc.targets['roadmap-toan-ai'].hosting.english,['g-learning-english']);
          console.log('ONLY_ENGLISH_HOSTING_PASS');
          NODE

      - name: Verify existing deployment authorization
        env:
          FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
        run: |
          if [ -z "$FIREBASE_ACCOUNT" ]; then
            echo "::error::Firebase deploy authorization unavailable"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install exact lockfile dependencies
        run: pnpm install --frozen-lockfile

      - name: Install audio QA dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Full QA with writing and new Gemini timing tests
        run: pnpm qa:release

      - name: Verify static production assets and English model
        run: |
          set -euo pipefail
          test -s dist/client/index.html
          test -s dist/client/foundation-audio/LIS-A2-01-v2.mp3
          test -s dist/client/foundation-audio/LIS-B1-01-v2.mp3
          node tests/writing-ai-on-demand.cjs
          node tests/english-tutor-knowledge-only.cjs

      - name: Deploy only English LIVE, after QA PASS
        id: englishlive
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
          projectId: roadmap-toan-ai
          target: english
          entryPoint: sites-p0-phase-a-20260926
          channelId: live
          disableComment: true
          firebaseToolsVersion: "15.32.1"

      - name: Check live English HTTP and audio assets
        run: |
          set -euo pipefail
          sleep 15
          root="https://g-learning-english.web.app"
          for item in / /foundation-audio/LIS-A2-01-v2.mp3 /foundation-audio/LIS-B1-01-v2.mp3 /diagnostic-audio/DIAG-LIS-01-v1.mp3; do
            curl --silent --show-error --fail --location --retry 10 --retry-all-errors --retry-delay 6 --retry-max-time 100 --output /dev/null "$root$item"
          done
          echo "ENGLISH_PRODUCTION_HTTP_PASS"

      - name: Record exact outcome, no claim of real-model PASS
        if: ${{ success() }}
        run: |
          echo "## G Learning English AI recovery" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate application commit: 7572807cd0ac5b104d67d53db871a8c015115f9b" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full release QA / TypeScript / static build: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live English Hosting: https://g-learning-english.web.app/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Normal human-browser Gemini real-response check: STILL REQUIRED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Math, billing, Rules, Auth and learner data: unchanged" >> "$GITHUB_STEP_SUMMARY"

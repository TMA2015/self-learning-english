name: ONE TIME English Writing Feedback QA and LIVE Release

on:
  push:
    branches:
      - ops/english-feedback-quality-once-20261101
    paths:
      - .github/workflows/english-feedback-quality-once-20261101.yml

permissions:
  contents: read

concurrency:
  group: english-hosting-release-feedback-20261101
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Verify exact approved application source
        env:
          EXPECTED_SOURCE: 4f94c060b3e30f02cecfe8f5df12d44cb6fd15f4
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/ops/english-feedback-quality-once-20261101"
          git fetch --no-tags --depth=1 origin "$EXPECTED_SOURCE"
          test "$(git diff --name-only "$EXPECTED_SOURCE" HEAD)" = ".github/workflows/english-feedback-quality-once-20261101.yml"
          echo "CANDIDATE_SOURCE_PASS $EXPECTED_SOURCE"

      - name: Check English-only Firebase target
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const f=JSON.parse(fs.readFileSync('firebase.json','utf8'));
          const rc=JSON.parse(fs.readFileSync('.firebaserc','utf8'));
          assert.equal(f.hosting.target,'english');
          assert.equal(f.hosting.public,'dist/client');
          assert.equal(rc.projects.default,'roadmap-toan-ai');
          assert.deepEqual(rc.targets['roadmap-toan-ai'].hosting.english,['g-learning-english']);
          NODE

      - name: Require existing Firebase deploy authorization
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
        run: test -n "$SA"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Audio tests dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Full QA and TypeScript production build
        run: pnpm qa:release

      - name: Confirm Writing feedback quality safeguards
        run: |
          node tests/writing-step-feedback-ux.cjs
          node tests/writing-ai-on-demand.cjs
          test -s dist/client/index.html
          test -s dist/client/foundation-audio/LIS-A2-01-v2.mp3
          test -s dist/client/foundation-audio/LIS-B1-01-v2.mp3

      - name: Publish tested files to English LIVE only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
          projectId: roadmap-toan-ai
          target: english
          entryPoint: sites-p0-phase-a-20260926
          channelId: live
          disableComment: true
          firebaseToolsVersion: "15.32.1"

      - name: Verify live app and audio after CDN propagation
        run: |
          set -euo pipefail
          sleep 15
          root="https://g-learning-english.web.app"
          for item in / /foundation-audio/LIS-A2-01-v2.mp3 /foundation-audio/LIS-B1-01-v2.mp3; do
            curl --silent --show-error --fail --location --retry 10 --retry-all-errors --retry-delay 6 --retry-max-time 100 --output /dev/null "$root$item"
          done
          echo "ENGLISH_LIVE_HTTP_PASS"

      - name: State exact release guarantees
        if: ${{ success() }}
        run: |
          echo "## G Learning English — Writing feedback quality repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: 4f94c060b3e30f02cecfe8f5df12d44cb6fd15f4" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full QA, TypeScript, static build, live HTTP smoke: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firebase site: https://g-learning-english.web.app/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Actual live AI semantic correctness: not certified by this QA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Math and learner storage: no deploy or migration" >> "$GITHUB_STEP_SUMMARY"

name: Learning Evidence v21 P2A QA
on:
  pull_request:
    paths:
      - 'sites-p0-phase-a-20260926/app/api/practice-progress/**'
      - 'sites-p0-phase-a-20260926/app/practice-progress.tsx'
      - 'sites-p0-phase-a-20260926/app/page.tsx'
      - 'sites-p0-phase-a-20260926/domain/practice-progress.ts'
      - 'sites-p0-phase-a-20260926/tests/practice-progress-p2a.cjs'
      - '.github/workflows/learning-evidence-p2a-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: P2A projection and v21 P1 regression
        run: node tests/practice-progress-p2a.cjs && node tests/course-v21-p1.cjs && node tests/v20-route-draft-safety.cjs
      - name: Content and application regressions
        run: node tests/content-quality.cjs && node tests/curriculum.cjs && node tests/run.cjs && node tests/academic.cjs
      - name: TypeScript and production build
        run: pnpm exec tsc --noEmit --incremental false && pnpm run build

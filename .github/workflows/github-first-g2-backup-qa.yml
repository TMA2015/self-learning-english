name: GitHub-first G2 Backup QA
on:
  pull_request:
    paths:
      - 'sites-p0-phase-a-20260926/application/export-learner.ts'
      - 'sites-p0-phase-a-20260926/application/restore-learner.ts'
      - 'sites-p0-phase-a-20260926/infrastructure/browser/local-backup.ts'
      - 'sites-p0-phase-a-20260926/app/local-backup-panel.tsx'
      - 'sites-p0-phase-a-20260926/app/page.tsx'
      - 'sites-p0-phase-a-20260926/tests/github-first-g2-backup-restore.cjs'
      - 'sites-p0-phase-a-20260926/tests/github-first-g2-course-selection.cjs'
      - 'sites-p0-phase-a-20260926/tests/github-first-g2-local-diagnostic.cjs'
      - 'sites-p0-phase-a-20260926/infrastructure/browser/local-diagnostic.ts'
      - 'sites-p0-phase-a-20260926/app/diagnostic-assessment.tsx'
      - 'sites-p0-phase-a-20260926/domain/course-p1.ts'
      - 'sites-p0-phase-a-20260926/infrastructure/browser/client-services.ts'
      - 'sites-p0-phase-a-20260926/infrastructure/browser/local-runtime.ts'
      - 'sites-p0-phase-a-20260926/infrastructure/storage/browser-local-repositories.ts'
      - 'sites-p0-phase-a-20260926/docs/G2_BACKUP_STATIC_20261004.md'
      - '.github/workflows/github-first-g2-backup-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Browser backup and restore round trip
        run: node tests/github-first-g2-backup-restore.cjs
      - name: Browser-local My Courses
        run: node tests/github-first-g2-course-selection.cjs
      - name: Browser-local Diagnostic
        run: node tests/github-first-g2-local-diagnostic.cjs
      - name: G1 browser runtime regressions
        run: node tests/github-first-browser-storage.cjs && node tests/github-first-g1-local-runtime.cjs
      - name: Portable learner regressions
        run: node tests/run.cjs && node tests/academic.cjs && node tests/version-aware-attempt-ux.cjs && node tests/practice-progress-p2a.cjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Production build compatibility
        run: pnpm run build

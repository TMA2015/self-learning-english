name: SLE PR QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sle-pr-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR merge without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify approved workflow and trigger policy
        run: node scripts/verify-actions-policy.cjs

      - name: Detect full application tree
        id: app
        shell: bash
        run: |
          if [[ -f sites-p0-phase-a-20260926/package.json && -f sites-p0-phase-a-20260926/pnpm-lock.yaml ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [[ -d sites-p0-phase-a-20260926 ]]; then
            echo '::error::Application directory exists but package.json or pnpm-lock.yaml is missing'
            exit 1
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'BASELINE_ONLY: policy QA passed; no full app checkout in this PR'
          fi

      - name: Install pnpm for full application QA
        if: ${{ steps.app.outputs.present == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Frozen dependency install
        if: ${{ steps.app.outputs.present == 'true' }}
        working-directory: sites-p0-phase-a-20260926
        run: pnpm install --frozen-lockfile

      - name: Ensure FFmpeg and FFprobe for audio validation
        if: ${{ steps.app.outputs.present == 'true' }}
        run: |
          set -euo pipefail
          # Reuse tools on GitHub runners; avoid a potentially stalled apt mirror.
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            for attempt in 1 2; do
              if sudo timeout --signal=TERM --kill-after=10s 100s \
                   apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update -qq && \
                 sudo timeout --signal=TERM --kill-after=10s 100s \
                   apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 \
                   install -y --no-install-recommends ffmpeg; then
                break
              fi
              if [[ "$attempt" == 1 ]]; then
                # Official Ubuntu packages, alternate mirror. Do not bypass the
                # mandatory FFmpeg/FFprobe existence and playback validation.
                echo '::warning::FFmpeg installation incomplete from Azure mirror; retry official Ubuntu archive'
                for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
                  if [[ -f "$source" ]]; then
                    sudo sed -i 's@azure.archive.ubuntu.com@archive.ubuntu.com@g' "$source"
                  fi
                done
              else
                echo '::error::FFmpeg unavailable for mandatory audio QA after bounded mirror fallback'
                exit 1
              fi
              sleep 3
            done
          fi
          ffmpeg -hide_banner -version >/dev/null
          ffprobe -hide_banner -version >/dev/null
          echo 'FFmpeg/FFprobe present: audio validation remains mandatory'

      - name: Full application release QA and static build (NO DEPLOY)
        if: ${{ steps.app.outputs.present == 'true' }}
        working-directory: sites-p0-phase-a-20260926
        run: pnpm qa:release

      - name: Record scope accurately
        if: ${{ success() }}
        run: |
          if [[ '${{ steps.app.outputs.present }}' == 'true' ]]; then
            echo 'Full application QA passed on PR code. No Firebase deployment or live AI test.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Repository policy QA passed. No application source on this PR; full QA not run.' >> "$GITHUB_STEP_SUMMARY"
          fi

name: ONE-TIME English AI Writing QA + English-only Production Release

# One exact operator-controlled push on a temporary ops branch. No push trigger
# exists in main or the long-lived release branch. This file is removed after.
on:
  push:
    branches:
      - ops/english-ai-writing-release-once-20261101
    paths:
      - .github/workflows/english-ai-writing-once-20261101.yml

permissions:
  contents: read

concurrency:
  group: english-v1180-release-refs/heads/release/nov2026-content-v1.18.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - name: Checkout one-time branch
        uses: actions/checkout@v4

      - name: Verify exact reviewed app tree and single-use event
        env:
          EXPECTED_PARENT: 2c339a3c5df458c8c603b33fe87ff2035ad79791
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/ops/english-ai-writing-release-once-20261101"
          git fetch --no-tags --depth=1 origin "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = ".github/workflows/english-ai-writing-once-20261101.yml"
          echo "ONE_TIME_SCOPE_PASS: only CI dispatch file changed; app source matches approved candidate $EXPECTED_PARENT"

      - name: Verify sole target is G Learning English Hosting
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const c=JSON.parse(fs.readFileSync('firebase.json','utf8'));
          const f=JSON.parse(fs.readFileSync('.firebaserc','utf8'));
          assert.equal(c.hosting.target,'english');
          assert.equal(c.hosting.public,'dist/client');
          assert.equal(f.projects.default,'roadmap-toan-ai');
          assert.deepEqual(f.targets['roadmap-toan-ai'].hosting.english,['g-learning-english']);
          assert(fs.existsSync('tests/writing-ai-on-demand.cjs'),'Writing AI release QA missing');
          console.log('ENGLISH_SITE_ONLY_PASS');
          NODE

      - name: Check existing Firebase credential before QA (never print)
        env:
          FB_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
        run: |
          test -n "$FB_SERVICE_ACCOUNT" || (echo "::error::Firebase deployment credential missing; no deployment" && exit 1)

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install mandatory audio QA tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Full strict release QA incl Writing AI, TypeScript and build
        run: pnpm qa:release

      - name: Verify build audio and Writing AI integration
        run: |
          set -euo pipefail
          test -s dist/client/index.html
          test -s dist/client/foundation-audio/LIS-A2-01-v2.mp3
          test -s dist/client/foundation-audio/LIS-B1-01-v2.mp3
          test -s dist/client/diagnostic-audio/DIAG-LIS-01-v1.mp3
          test ! -e dist/client/foundation-audio/LIS-A2-01-v1.mp3
          node tests/writing-ai-on-demand.cjs
          echo "READY_TO_DEPLOY English Hosting build"

      - name: Deploy verified English build to Firebase LIVE only
        id: english_release
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
          projectId: roadmap-toan-ai
          target: english
          entryPoint: sites-p0-phase-a-20260926
          channelId: live
          disableComment: true
          firebaseToolsVersion: '15.32.1'

      - name: Production HTTP smoke with CDN retries
        run: |
          set -euo pipefail
          sleep 20
          root="https://g-learning-english.web.app"
          for item in / /foundation-audio/LIS-A2-01-v2.mp3 /foundation-audio/LIS-B1-01-v2.mp3 /diagnostic-audio/DIAG-LIS-01-v1.mp3; do
            echo "Checking $root$item"
            curl --silent --show-error --fail --location --retry 12 --retry-all-errors --retry-delay 7 --retry-max-time 110 --output /dev/null "$root$item"
          done
          echo "PRODUCTION_HTTP_PASS"

      - name: Release evidence (real Gemini call still separate)
        if: ${{ success() }}
        run: |
          echo "## Self-Learning English — AI Writing candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact reviewed app parent: \`2c339a3c5df458c8c603b33fe87ff2035ad79791\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full QA + Writing integration + TypeScript + static build: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firebase Hosting LIVE (only English): https://g-learning-english.web.app/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Real end-to-end Gemini / App Check evaluation: NOT VERIFIED BY THIS JOB" >> "$GITHUB_STEP_SUMMARY"

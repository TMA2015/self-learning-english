name: English Manual Release QA (bounded)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Enter RUN to run a single bounded release test"
        required: true
        type: string
      deploy_preview:
        description: "After QA PASS, deploy ONLY to nov2026-v1180 Firebase preview (never live)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: english-release-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-qa:
    if: ${{ github.event.inputs.confirm == 'RUN' && github.ref_name == 'release/nov2026-content-v1.18.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - name: Checkout exact selected branch
        uses: actions/checkout@v4
      - name: Reject automatic/duplicated workflows before costly QA
        run: node ../scripts/verify-actions-policy.cjs
      - name: Ensure release source is actually present
        run: |
          test -f package.json
          test -f content/curriculum-1.18.0-candidate.json
          test -f tests/nov-2026-content-preflight.cjs
      - name: Validate audio and content before build
        run: node tests/nov-2026-content-preflight.cjs
      - name: Verify Firebase preview credential is configured
        if: ${{ inputs.deploy_preview == true }}
        env:
          FIREBASE_PREVIEW_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
        run: |
          if [ -z "$FIREBASE_PREVIEW_CREDENTIAL" ]; then
            echo "Firebase Hosting service-account secret missing; no preview deployed"
            exit 1
          fi
      - name: Verify 38 audio fingerprints and rights inventory
        run: node tests/audio-rights-release-gate.cjs
      - name: Block preview without complete audio rights approval
        if: ${{ inputs.deploy_preview == true }}
        run: node tests/audio-rights-release-gate.cjs --require-clearance
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: sites-p0-phase-a-20260926/pnpm-lock.yaml
      - name: Install frozen dependencies exactly once
        run: pnpm install --frozen-lockfile
      - name: Install FFmpeg tools for mandatory codec checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -1
      - name: Run consolidated release QA (one job only)
        run: pnpm qa:release

      - name: Deploy QA-passed build to Firebase preview only
        if: ${{ inputs.deploy_preview == true }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
          projectId: roadmap-toan-ai
          target: english
          entryPoint: sites-p0-phase-a-20260926
          channelId: nov2026-v1180
          expires: 7d
          disableComment: true
          firebaseToolsVersion: '15.32.1'

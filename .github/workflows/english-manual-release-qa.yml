name: SLE Authorized English LIVE Release

# Only an owner-approved merge into protected main with [release-english]
# triggers the release. No Preview, no manual run and no Math deployment.
on:
  push:
    branches: [main]
    paths:
      - 'sites-p0-phase-a-20260926/**'
      - '.github/workflows/english-manual-release-qa.yml'

permissions:
  contents: read

concurrency:
  group: sle-english-live-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-english]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - name: Checkout exact approved main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify authorization and English-only source
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          node --input-type=commonjs - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const cfg=JSON.parse(fs.readFileSync('firebase.json','utf8'));
          const rc=JSON.parse(fs.readFileSync('.firebaserc','utf8'));
          const candidate=require('./content/curriculum-1.22.0-candidate.json');
          const baseline=require('./content/curriculum-1.21.0-candidate.json');
          assert.equal(candidate.schema_version,'1.22.0');
          assert.equal(baseline.schema_version,'1.21.0');
          assert.equal(baseline.lessons.length,132);
          assert.deepEqual(candidate.lessons.slice(0,132),baseline.lessons,'Historical lessons must remain unchanged');
          assert.equal(candidate.lessons.length,136);
          assert.equal(candidate.lessons.reduce((s,l)=>s+l.activities.length,0),1066);
          assert.equal(cfg.hosting.target,'english');
          assert.equal(cfg.hosting.public,'dist/client');
          assert.equal(rc.projects.default,'roadmap-toan-ai');
          assert.deepEqual(rc.targets['roadmap-toan-ai'].hosting.english,['g-learning-english']);
          assert(fs.existsSync('docs/SLE_MASTER_CONTENT_AND_SELF_LEARNING_STANDARD.md'));
          console.log('ENGLISH_RELEASE_SCOPE_PASS: v1.22.0 / English only');
          NODE
          node ../scripts/verify-actions-policy.cjs
          node tests/nov-2026-content-preflight.cjs
          node tests/audio-rights-release-gate.cjs --require-clearance

      - name: Confirm Firebase credential before expensive CI
        env:
          FIREBASE_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
        run: |
          if [[ -z "$FIREBASE_CREDENTIAL" ]]; then
            echo '::error::Firebase Hosting credential not configured; no deploy'
            exit 1
          fi
          echo 'Firebase credential present (contents not logged)'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Ensure FFmpeg and FFprobe with bounded installation
        run: |
          set -euo pipefail
          # GitHub-hosted runner images vary: avoid unnecessary package-network
          # operations when both audio validation tools already exist.
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            # Never let an apt mirror or package lock consume the whole release
            # job. Fail closed before QA/deploy if audio tools cannot be installed.
            for attempt in 1 2; do
              echo "FFmpeg install attempt $attempt/2"
              if sudo timeout --signal=TERM --kill-after=10s 100s \
                   apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update -qq && \
                 sudo timeout --signal=TERM --kill-after=10s 100s \
                   apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 \
                   install -y --no-install-recommends ffmpeg; then
                break
              fi
              if [[ "$attempt" == 2 ]]; then
                echo '::error::FFmpeg installation failed; refusing English deploy'
                exit 1
              fi
              sleep 3
            done
          fi
          ffmpeg -hide_banner -version >/dev/null
          ffprobe -hide_banner -version >/dev/null
          echo 'FFmpeg and FFprobe verified; audio QA and English deploy remain mandatory'

      - name: Full release QA, TS, static build and audio validation
        id: release_qa
        run: pnpm qa:release

      - name: Verify exact English build artifacts
        run: |
          set -euo pipefail
          test -s dist/client/index.html
          test -s dist/client/foundation-audio/LIS-A1-06-v1.mp3
          test -s dist/client/foundation-audio/LIS-A2-07-v1.mp3
          test -s dist/client/foundation-audio/LIS-B1-08-v1.mp3
          test -s dist/client/foundation-audio/LIS-A2-01-v2.mp3
          test -s dist/client/foundation-audio/LIS-B1-01-v2.mp3
          test -s dist/client/foundation-audio/LIS-A1-01-v2.mp3
          test -s dist/client/foundation-audio/LIS-A2-02-v2.mp3
          test -s dist/client/foundation-audio/LIS-B1-02-v2.mp3
          test -s dist/client/diagnostic-audio/DIAG-LIS-01-v1.mp3
          test ! -e dist/client/foundation-audio/LIS-A2-01-v1.mp3
          test ! -e dist/client/foundation-audio/LIS-B1-01-v1.mp3
          echo 'ENGLISH_BUILD_PASS'

      - name: Deploy Firebase Hosting English LIVE only
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
          projectId: roadmap-toan-ai
          target: english
          entryPoint: sites-p0-phase-a-20260926
          channelId: live
          disableComment: true
          firebaseToolsVersion: '15.32.1'

      - name: Check LIVE English HTML and valid audio
        id: live_smoke
        run: |
          set -euo pipefail
          base='https://g-learning-english.web.app'
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          sleep 15
          for asset in / /foundation-audio/LIS-A1-06-v1.mp3 /foundation-audio/LIS-A2-07-v1.mp3 /foundation-audio/LIS-B1-08-v1.mp3 /foundation-audio/LIS-A2-01-v2.mp3 /foundation-audio/LIS-B1-01-v2.mp3 /foundation-audio/LIS-A1-01-v2.mp3 /foundation-audio/LIS-A2-02-v2.mp3 /foundation-audio/LIS-B1-02-v2.mp3 /diagnostic-audio/DIAG-LIS-01-v1.mp3; do
            valid=0
            for attempt in {1..10}; do
              if curl --silent --show-error --fail --location --connect-timeout 10 --max-time 20 --output "$tmp" "$base$asset" && test -s "$tmp"; then
                if [[ "$asset" == '/' ]] && grep -Eiq '<(!doctype html|html)([[:space:]>])' "$tmp"; then valid=1; fi
                if [[ "$asset" == *.mp3 ]] && [[ "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$tmp" 2>/dev/null || true)" == 'mp3' ]]; then valid=1; fi
              fi
              if [[ "$valid" == 1 ]]; then break; fi
              if [[ "$attempt" -lt 10 ]]; then sleep 6; fi
            done
            if [[ "$valid" != 1 ]]; then
              echo "::error::English LIVE asset unverified: $asset; deploy may already have succeeded"
              exit 1
            fi
            echo "LIVE_ASSET_PASS: $asset"
          done

      - name: Report QA, deploy and live verification separately
        if: ${{ always() }}
        working-directory: .
        env:
          QA_RESULT: ${{ steps.release_qa.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          SMOKE_RESULT: ${{ steps.live_smoke.outcome }}
        run: |
          {
            echo '## SLE English LIVE release'
            echo "- Commit: $GITHUB_SHA"
            echo "- Full QA: $QA_RESULT"
            echo "- Firebase LIVE deploy: $DEPLOY_RESULT"
            echo "- LIVE HTML/MP3 verification: $SMOKE_RESULT"
            echo '- Website: https://g-learning-english.web.app/'
            echo '- Remaining owner spot-check: wrong-answer feedback, Listening, saved draft, optional Gemini and mobile'
            echo '- If deploy succeeded but smoke failed: DEPLOYED / UNVERIFIED; review Hosting release history before rollback'
            echo '- Rollback: Firebase Console > Hosting > g-learning-english > release history > previous release'
          } >> "$GITHUB_STEP_SUMMARY"

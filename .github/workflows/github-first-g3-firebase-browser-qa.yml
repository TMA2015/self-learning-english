name: GitHub-first G3 Firebase Browser QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    env:
      STATIC_EXPORT: '1'
      NEXT_PUBLIC_LEARNING_RUNTIME: browser
      NEXT_PUBLIC_BASE_PATH: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Firebase browser bridge contract
        run: node tests/g3-firebase-browser-bridge.cjs
      - name: Existing tutor regressions
        run: node tests/run.cjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Static Firebase Hosting build
        run: pnpm run build

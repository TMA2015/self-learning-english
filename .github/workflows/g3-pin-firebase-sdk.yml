name: G3 Pin Firebase SDK

on:
  push:
    branches:
      - github-first/g3-firebase-ai-20261004
    paths:
      - '.github/workflows/g3-pin-firebase-sdk.yml'

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: github-first/g3-firebase-ai-20261004
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pin official Firebase JavaScript SDK
        working-directory: sites-p0-phase-a-20260926
        run: pnpm add firebase@12.19.0 --save-exact
      - name: Commit package and lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites-p0-phase-a-20260926/package.json sites-p0-phase-a-20260926/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Firebase SDK is already pinned."
          else
            git commit -m "build: pin Firebase JS SDK 12.19.0"
            git push origin HEAD:github-first/g3-firebase-ai-20261004
          fi

name: SLE iPad temporary English Preview (branch only)

# Owner-approved one-off exception for physical Safari upgrade QA.
# This workflow exists ONLY on the isolated QA branch; never merge into main.
on:
  push:
    branches:
      - qa/sle-ipad-preview-20261120
    paths:
      - 'sites-p0-phase-a-20260926/**'
      - '.github/workflows/english-safari-preview-qa.yml'

permissions:
  contents: read

concurrency:
  group: sle-ipad-preview-english-20261120
  cancel-in-progress: false

jobs:
  english_preview:
    if: ${{ github.repository == 'TMA2015/self-learning-english' && github.ref == 'refs/heads/qa/sle-ipad-preview-20261120' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Match the exact static Firebase Hosting build profile in qa-release.mjs.
      STATIC_EXPORT: '1'
      NEXT_PUBLIC_LEARNING_RUNTIME: browser
      NEXT_PUBLIC_BASE_PATH: ''
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - name: Checkout exact QA branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify exact scope, version and non-live Firebase target
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/qa/sle-ipad-preview-20261120' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          node --input-type=commonjs - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const cfg=JSON.parse(fs.readFileSync('firebase.json','utf8'));
          const rc=JSON.parse(fs.readFileSync('.firebaserc','utf8'));
          assert.equal(cfg.hosting.target,'english');
          assert.equal(cfg.hosting.public,'dist/client');
          assert.equal(rc.projects.default,'roadmap-toan-ai');
          assert.deepEqual(rc.targets['roadmap-toan-ai'].hosting.english,['g-learning-english']);
          const runtime=fs.readFileSync('infrastructure/browser/local-runtime.ts','utf8');
          const ver=runtime.includes("import curriculum1250 from '../../content/curriculum-1.25.0-candidate.json'")?'1.25.0':
                    runtime.includes("import curriculum1280 from '../../content/curriculum-1.28.0-candidate.json'")?'1.28.0':null;
          assert(ver==='1.25.0'||ver==='1.28.0','Only reviewed 1.25/1.28 curriculum allowed');
          const source=require('./content/curriculum-'+ver+'-candidate.json');
          assert.equal(source.schema_version,ver);
          assert.equal(source.lessons.length,ver==='1.25.0'?154:176);
          assert.equal(source.lessons.flatMap(l=>l.activities).length,ver==='1.25.0'?1125:1224);
          console.log('PREVIEW_SCOPE_PASS: English-only isolated channel, curriculum '+ver);
          NODE

      - name: Confirm Firebase Hosting credential configured
        env:
          FIREBASE_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
        run: |
          if [[ -z "$FIREBASE_CREDENTIAL" ]]; then
            echo '::error::English Firebase Hosting credential not configured; stop before build/deploy'
            exit 1
          fi
          echo 'Firebase credential present (secret not logged)'

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Frozen dependency installation
        run: pnpm install --frozen-lockfile

      - name: Build English static Preview (no LIVE release)
        run: pnpm build

      - name: Verify English build and exact audio integrity
        run: |
          set -euo pipefail
          node tests/firebase-hosting-static.cjs
          test -s dist/client/index.html
          test -s dist/client/foundation-audio/LIS-A1-06-v1.mp3
          test -s dist/client/foundation-audio/LIS-A2-07-v1.mp3
          test -s dist/client/diagnostic-audio/DIAG-LIS-01-v1.mp3
          echo 'PREVIEW_BUILD_VERIFIED'

      - name: Deploy to expiring English Preview channel ONLY (never live)
        id: deploy_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
          projectId: roadmap-toan-ai
          target: english
          entryPoint: sites-p0-phase-a-20260926
          channelId: sle-v128-ipad-qa-20261120
          expires: 7d
          disableComment: true
          firebaseToolsVersion: '15.32.1'

      - name: Record Preview scope and URL for owner
        if: ${{ always() }}
        working-directory: .
        env:
          PREVIEW_DEPLOY: ${{ steps.deploy_preview.outcome }}
          PREVIEW_URLS: ${{ steps.deploy_preview.outputs.urls }}
        run: |
          {
            echo '## SLE physical iPad Safari Preview'
            echo "- QA branch: $GITHUB_REF"
            echo "- Exact commit: $GITHUB_SHA"
            echo "- Deploy to expiring English preview channel: $PREVIEW_DEPLOY"
            echo "- Preview URL(s): $PREVIEW_URLS"
            echo '- Stage 1 is v1.25.0 synthetic baseline. Do not switch to v1.28.0 until the owner has saved disposable iPad lesson data.'
            echo '- No merge, no LIVE deploy, no Math changes, no user data migration.'
          } >> "$GITHUB_STEP_SUMMARY"

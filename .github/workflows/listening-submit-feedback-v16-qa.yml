name: v16 Listening Submit Feedback QA

on:
  pull_request:
    paths:
      - 'sites-p0-phase-a-20260926/app/foundation.tsx'
      - 'sites-p0-phase-a-20260926/app/globals.css'
      - 'sites-p0-phase-a-20260926/domain/listening-completeness.ts'
      - 'sites-p0-phase-a-20260926/tests/listening-submit-feedback.cjs'
      - 'sites-p0-phase-a-20260926/docs/LISTENING_INCOMPLETE_SUBMIT_V16.md'
      - '.github/workflows/listening-submit-feedback-v16-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Check incomplete Listening and mobile feedback
        run: node tests/listening-submit-feedback.cjs
      - name: Guard current v16 learning flow and curriculum compatibility
        run: node tests/attempt-navigation-ui.cjs && node tests/writing-nav-save-feedback.cjs && node tests/catalog-groups.cjs && node tests/curriculum-13-compat-v15.cjs
      - name: Production build only — no deployment or import
        run: pnpm run build

name: P2B Suggested Practice UI QA
on:
  pull_request:
    paths:
      - 'sites-p0-phase-a-20260926/app/practice-progress.tsx'
      - 'sites-p0-phase-a-20260926/app/page.tsx'
      - 'sites-p0-phase-a-20260926/app/foundation.tsx'
      - 'sites-p0-phase-a-20260926/tests/p2b-suggested-practice-ui.cjs'
      - '.github/workflows/p2b-suggested-practice-ui-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: P2B Suggested Practice UI
        run: node tests/p2b-suggested-practice-ui.cjs && node tests/p2b-adaptive-recommendations.cjs && node tests/practice-progress-p2a.cjs
      - name: Version-aware navigation regressions
        run: node tests/version-aware-attempt-ux.cjs && node tests/attempt-navigation-ui.cjs && node tests/ux-v20-lesson-navigation.cjs && node tests/v20-route-draft-safety.cjs
      - name: Writing and course regressions
        run: node tests/writing-nav-save-feedback.cjs && node tests/run.cjs && node tests/course-v21-p1.cjs
      - name: TypeScript and production build
        run: pnpm exec tsc --noEmit --incremental false && pnpm run build

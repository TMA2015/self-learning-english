name: GitHub-first G1 Local Runtime QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Browser repository contract
        run: node tests/github-first-browser-storage.cjs
      - name: Deterministic local learning flow
        run: node tests/github-first-g1-local-runtime.cjs
      - name: Foundation and progress regressions
        run: node tests/academic.cjs && node tests/content-quality.cjs && node tests/version-aware-attempt-ux.cjs && node tests/practice-progress-p2a.cjs
      - name: Portable core
        run: node tests/run.cjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Production build compatibility
        run: pnpm run build

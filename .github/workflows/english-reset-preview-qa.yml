name: SLE one-row reset English Preview only

# Temporary owner-approved preview for PR #190. QA branch ONLY. NEVER merge into main.
on:
  push:
    branches:
      - qa/sle-reset-one-row-preview-20261121
    paths:
      - '.github/workflows/english-reset-preview-qa.yml'

permissions:
  contents: read

concurrency:
  group: sle-reset-pr190-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ github.repository == 'TMA2015/self-learning-english' && github.ref == 'refs/heads/qa/sle-reset-one-row-preview-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STATIC_EXPORT: '1'
      NEXT_PUBLIC_LEARNING_RUNTIME: browser
      NEXT_PUBLIC_BASE_PATH: ''
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - name: Checkout exact isolated QA branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact PR 190 source and English-only hosting
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 'fbbbd7bcf09390ff2726c5e8fe5c0a44d93705ff' HEAD
          test "$(git diff --name-only fbbbd7bcf09390ff2726c5e8fe5c0a44d93705ff HEAD)" = '.github/workflows/english-reset-preview-qa.yml'
          node --input-type=commonjs - <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs');
          const cfg=JSON.parse(fs.readFileSync('firebase.json','utf8'));
          const rc=JSON.parse(fs.readFileSync('.firebaserc','utf8'));
          a.equal(cfg.hosting.target,'english');
          a.equal(cfg.hosting.public,'dist/client');
          a.equal(rc.projects.default,'roadmap-toan-ai');
          a.deepEqual(rc.targets['roadmap-toan-ai'].hosting.english,['g-learning-english']);
          const runtime=fs.readFileSync('infrastructure/browser/local-runtime.ts','utf8');
          a(runtime.includes("import curriculum1280 from '../../content/curriculum-1.28.0-candidate.json'"));
          const clear=fs.readFileSync('infrastructure/browser/local-recovery.ts','utf8');
          a(clear.includes('export async function clearLocalEnglishProgress('));
          a(!clear.includes('localStorage.clear('));
          console.log('SLE_RESET_ENGLISH_ONLY_SOURCE_PASS');
          NODE

      - name: Check existing Firebase credential (not logged)
        env:
          FIREBASE_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
        run: |
          test -n "$FIREBASE_CREDENTIAL" || { echo '::error::Firebase credential absent'; exit 1; }
          echo 'Firebase credential present'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: TypeScript-compiled Recovery and real-browser destructive-reset QA
        run: |
          set -euo pipefail
          # local-recovery-v2 compiles the typed recovery modules, and storage-ui-browser bundles the React/TSX panel.
          # Global tsc is still mandatory in the separate exact-head full PR QA after generated curriculum fixtures.
          node tests/local-recovery-v2.cjs
          node tests/ipad-recovery-lossless-quota.cjs
          node tests/storage-ui-browser.cjs

      - name: Build English static Preview without LIVE changes
        run: pnpm build

      - name: Check static English Hosting build including audio
        run: |
          node tests/firebase-hosting-static.cjs
          test -s dist/client/index.html
          test -s dist/client/foundation-audio/LIS-A1-06-v1.mp3
          test -s dist/client/diagnostic-audio/DIAG-LIS-01-v1.mp3

      - name: Deploy isolated short-lived English Preview (not LIVE)
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROADMAP_TOAN_AI }}
          projectId: roadmap-toan-ai
          target: english
          entryPoint: sites-p0-phase-a-20260926
          channelId: sle-reset-pr190
          expires: 3d
          disableComment: true
          firebaseToolsVersion: '15.32.1'

      - name: Smoke-test actual Preview URL and MP3 (not LIVE)
        env:
          PREVIEW_URLS: ${{ steps.deploy.outputs.urls }}
        run: |
          set -euo pipefail
          url="$(node -p 'JSON.parse(process.env.PREVIEW_URLS)[0]')"
          [[ "$url" == https://g-learning-english--sle-reset-pr190-*.web.app ]]
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --connect-timeout 10 --max-time 30 "$url/" -o "$tmp"
          grep -Eiq '<(!doctype html|html)([[:space:]>])' "$tmp"
          curl -fsSL --connect-timeout 10 --max-time 30 "$url/foundation-audio/LIS-A1-06-v1.mp3" -o "$tmp"
          test -s "$tmp"
          echo "SLE_RESET_PREVIEW_SMOKE_PASS: $url"

      - name: Publish actual Preview URL and boundaries
        if: ${{ always() }}
        working-directory: .
        env:
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
          PREVIEW_URLS: ${{ steps.deploy.outputs.urls }}
        run: |
          {
            echo '## SLE #190 English-only on-device reset Preview'
            echo '- Exact approved Draft PR code: fbbbd7bcf09390ff2726c5e8fe5c0a44d93705ff'
            echo "- Preview QA branch commit: $GITHUB_SHA"
            echo "- Preview deploy: $DEPLOY_STATUS"
            echo "- URL: $PREVIEW_URLS"
            echo '- Preview expires after 3 days. Use disposable synthetic learner progress ONLY.'
            echo '- NEVER import private owner Recovery V2 into this destructive-control Preview.'
            echo '- No LIVE deploy, no main merge, no Math/Auth/data modifications.'
          } >> "$GITHUB_STEP_SUMMARY"

name: GitHub-first G3 Firebase AI Contract QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Firebase AI Logic provider contract
        run: node tests/g3-firebase-ai-provider-contract.cjs
      - name: Existing Writing tutor regressions
        run: node tests/run.cjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false

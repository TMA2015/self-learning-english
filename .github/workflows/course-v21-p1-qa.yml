name: Course v21 P1 QA

on:
  pull_request:
    paths:
      - 'sites-p0-phase-a-20260926/app/api/course/**'
      - 'sites-p0-phase-a-20260926/app/api/state/route.ts'
      - 'sites-p0-phase-a-20260926/app/my-courses.tsx'
      - 'sites-p0-phase-a-20260926/app/page.tsx'
      - 'sites-p0-phase-a-20260926/domain/course-p1.ts'
      - 'sites-p0-phase-a-20260926/infrastructure/storage/d1-course-selection.ts'
      - 'sites-p0-phase-a-20260926/tests/course-v21-p1.cjs'
      - '.github/workflows/course-v21-p1-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: P1 isolation, concurrency, rollback and v20 UX gates
        run: node tests/course-v21-p1.cjs && node tests/v20-route-draft-safety.cjs && node tests/ux-v20-lesson-navigation.cjs && node tests/attempt-navigation-ui.cjs && node tests/writing-nav-save-feedback.cjs
      - name: Content and application regressions
        run: node tests/content-quality.cjs && node tests/curriculum.cjs && node tests/run.cjs && node tests/academic.cjs
      - name: Production build only
        run: pnpm run build

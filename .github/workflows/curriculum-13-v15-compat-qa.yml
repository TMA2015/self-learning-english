name: Curriculum 1.3 / Batch04 Compatibility QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check historical group memberships and Batch04 importer tags
        run: node tests/catalog-groups.cjs && node tests/curriculum-13-compat-v15.cjs && node tests/batch04-code-compat.cjs
      - name: Guard v15 Foundation, catalog and draft-save UX
        run: node tests/catalog-taxonomy-ui.cjs && node tests/attempt-navigation-ui.cjs && node tests/writing-nav-save-feedback.cjs
      - name: Production build without data import or Site deployment
        run: pnpm run build

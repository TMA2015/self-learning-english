name: Curriculum 1.6.0 Grammar Wave 1A QA
on:
  pull_request:
    paths:
      - 'sites-p0-phase-a-20260926/content/releases/curriculum-1.5.0-production-import.json'
      - 'sites-p0-phase-a-20260926/content/batches/grammar-wave1a.json'
      - 'sites-p0-phase-a-20260926/content/curriculum-1.6.0-candidate.json'
      - 'sites-p0-phase-a-20260926/tests/curriculum-160-wave1a.cjs'
      - '.github/workflows/curriculum-160-wave1a-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-p0-phase-a-20260926
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Curriculum 1.6.0 Wave 1A candidate
        run: node tests/curriculum-160-wave1a.cjs
      - name: Existing academic/content regressions
        run: node tests/academic.cjs && node tests/content-quality.cjs && node tests/curriculum.cjs && node tests/run.cjs
      - name: Version-aware and learning-evidence regressions
        run: node tests/version-aware-attempt-ux.cjs && node tests/practice-progress-p2a.cjs && node tests/course-v21-p1.cjs
      - name: TypeScript and production build
        run: pnpm exec tsc --noEmit --incremental false && pnpm run build
